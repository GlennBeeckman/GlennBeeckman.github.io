<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Convert Markdown to HTML instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>Markdown ↔ HTML</h1>
      <p class="lead">Convert between Markdown and HTML formats.</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <h3>Markdown to HTML</h3>
        <label for="md-input">Markdown</label>
        <textarea id="md-input" placeholder="# Heading&#10;&#10;**Bold** text&#10;&#10;- List item"></textarea>
        <div class="tool-actions">
          <button type="button" id="md-to-html">Convert</button>
          <button type="button" id="md-clear" class="ghost">Clear</button>
        </div>
        <label for="html-output">HTML</label>
        <textarea id="html-output" readonly placeholder="Result"></textarea>
        <button type="button" id="html-copy" class="ghost">Copy</button>
        <p class="status" id="md-status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
