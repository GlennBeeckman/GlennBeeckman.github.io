<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Base64 encode/decode utility.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>Base64 encode / decode</h1>
      <p class="lead">Convert plain text to Base64 and decode Base64 values back to text.</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <label for="base64-input">Input</label>
        <textarea id="base64-input" placeholder="Paste text or Base64 value"></textarea>
        <div class="tool-actions">
          <button type="button" id="base64-encode">Encode</button>
          <button type="button" id="base64-decode">Decode</button>
          <button type="button" id="base64-clear" class="ghost">Clear</button>
        </div>
        <label for="base64-output">Output</label>
        <textarea id="base64-output" readonly placeholder="Result"></textarea>
        <p class="status" id="base64-status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
