<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Converter Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Convert between Decimal, Hex, Binary, and Octal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>Number Converter</h1>
      <p class="lead">Convert between Decimal, Hexadecimal, Binary, and Octal.</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label for="decimal-input">Decimal</label>
            <input type="number" id="decimal-input" placeholder="255" />
          </div>
          <div>
            <label for="hex-input">Hexadecimal</label>
            <input type="text" id="hex-input" placeholder="FF" />
          </div>
          <div>
            <label for="binary-input">Binary</label>
            <input type="text" id="binary-input" placeholder="11111111" />
          </div>
          <div>
            <label for="octal-input">Octal</label>
            <input type="text" id="octal-input" placeholder="377" />
          </div>
        </div>

        <p class="status" id="number-status" aria-live="polite" style="margin-top: 1rem;"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
