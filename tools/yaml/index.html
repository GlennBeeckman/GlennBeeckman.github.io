<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAML Formatter Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Format and validate YAML.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>YAML Formatter</h1>
      <p class="lead">Format and validate YAML syntax (basic validation).</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <label for="yaml-input">YAML Input</label>
        <textarea id="yaml-input" placeholder="name: John&#10;age: 30&#10;active: true"></textarea>
        <div class="tool-actions">
          <button type="button" id="yaml-format">Format</button>
          <button type="button" id="yaml-validate">Validate</button>
          <button type="button" id="yaml-clear" class="ghost">Clear</button>
        </div>
        <label for="yaml-output">Output</label>
        <textarea id="yaml-output" readonly placeholder="Result"></textarea>
        <button type="button" id="yaml-copy" class="ghost">Copy</button>
        <p class="status" id="yaml-status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
