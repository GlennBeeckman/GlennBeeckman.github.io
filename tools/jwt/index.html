<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Decoder Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Decode and inspect JSON Web Tokens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>JWT Decoder</h1>
      <p class="lead">Decode and inspect JSON Web Tokens without verification.</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <label for="jwt-input">JWT Token</label>
        <textarea id="jwt-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
        <div class="tool-actions">
          <button type="button" id="jwt-decode">Decode</button>
          <button type="button" id="jwt-clear" class="ghost">Clear</button>
        </div>

        <label for="jwt-header" style="margin-top: 1rem;">Header</label>
        <textarea id="jwt-header" readonly placeholder="Header will appear here"></textarea>
        <button type="button" id="jwt-header-copy" class="ghost">Copy</button>

        <label for="jwt-payload" style="margin-top: 1rem;">Payload</label>
        <textarea id="jwt-payload" readonly placeholder="Payload will appear here"></textarea>
        <button type="button" id="jwt-payload-copy" class="ghost">Copy</button>

        <label for="jwt-signature" style="margin-top: 1rem;">Signature (not verified)</label>
        <input type="text" id="jwt-signature" readonly placeholder="Signature will appear here" />

        <p class="status" id="jwt-status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
