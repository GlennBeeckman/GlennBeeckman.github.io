<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML Formatter Tool | GlennBeeckman.dev</title>
  <meta name="description" content="Format and validate XML.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      GlennBeeckman.dev
    </a>
    <nav>
      <a href="../index.html">Tools</a>
      <a href="../../blog/index.html">Blog</a>
      <a href="../../index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="hero reveal">
      <p class="kicker">Tool</p>
      <h1>XML Formatter</h1>
      <p class="lead">Format and validate XML syntax.</p>
    </section>

    <section class="panel reveal">
      <article class="tool-card">
        <label for="xml-input">XML Input</label>
        <textarea id="xml-input" placeholder="&lt;root&gt;&lt;name&gt;John&lt;/name&gt;&lt;/root&gt;"></textarea>
        <div class="tool-actions">
          <button type="button" id="xml-format">Format</button>
          <button type="button" id="xml-validate">Validate</button>
          <button type="button" id="xml-clear" class="ghost">Clear</button>
        </div>
        <label for="xml-output">Output</label>
        <textarea id="xml-output" readonly placeholder="Result"></textarea>
        <button type="button" id="xml-copy" class="ghost">Copy</button>
        <p class="status" id="xml-status" aria-live="polite"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">Back to tools</a></p>
  </footer>

  <script src="../../assets/js/main.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
